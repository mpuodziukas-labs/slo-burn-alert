groups:
  - name: slo-availability-burn
    rules:
      - alert: AvailabilityBurnPage
        expr: |
          (sum(rate(http_requests_total{code=~"5.."}[1h])) / sum(rate(http_requests_total[1h])) > 0.0144)
          and
          (sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.0144)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Availability error budget burning at more than 14.4x over 1h and 5m"
          runbook: "RUNBOOK.md"
      - alert: AvailabilityBurnTicket
        expr: |
          (sum(rate(http_requests_total{code=~"5.."}[6h])) / sum(rate(http_requests_total[6h])) > 0.006)
          and
          (sum(rate(http_requests_total{code=~"5.."}[30m])) / sum(rate(http_requests_total[30m])) > 0.006)
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Availability error budget burning at more than 6x over 6h and 30m"
  - name: slo-latency-burn
    rules:
      - alert: LatencyBurnPage
        expr: |
          (1 - sum(rate(http_request_duration_seconds_bucket{le="0.3"}[1h])) / sum(rate(http_request_duration_seconds_count[1h])) > 0.144)
          and
          (1 - sum(rate(http_request_duration_seconds_bucket{le="0.3"}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.144)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Latency error budget burning at more than 14.4x over 1h and 5m"
          runbook: "RUNBOOK.md"
      - alert: LatencyBurnTicket
        expr: |
          (1 - sum(rate(http_request_duration_seconds_bucket{le="0.3"}[6h])) / sum(rate(http_request_duration_seconds_count[6h])) > 0.06)
          and
          (1 - sum(rate(http_request_duration_seconds_bucket{le="0.3"}[30m])) / sum(rate(http_request_duration_seconds_count[30m])) > 0.06)
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Latency error budget burning at more than 6x over 6h and 30m"
